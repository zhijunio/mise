# see bootstrap.sh for a way to set everything up 

min_version = "2026.9.11"

# Mask these in captured task output. (Does not encrypt the file.)
redactions = [
  "*_ACCESS_KEY",
  "*_ACCESS_TOKEN",
  "*_API_KEY",
  "*_AUTH_HEADER",
  "*_SECRET_KEY",
]

#
[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node", "java"]

[settings.age]
ssh_identity_files = ["~/.ssh/mise_private_key"]

# ---------------------------------------------------------------- tools ----

[tools]
# Java and Node remain here when configured; other Brew-managed tools live in
# Brewfile so Homebrew is the single package manager for them.
node = "24.18.0"
java = ["21", "zulu-8", "25"]


# ------------------------------------------------- environment variables ----

[env]
# Prepended to PATH, highest precedence first. 
_.path = [
  "/opt/homebrew/opt/curl/bin",
  "/opt/homebrew/opt/libpq/bin",
  "/opt/homebrew/opt/rustup/bin",
  "{{env.HOME}}/bin",
  "{{env.HOME}}/.docker/bin",
  # brew shellenv's PATH half; last so the opt/* overrides above win.
  "/opt/homebrew/bin",
  "/opt/homebrew/sbin",
]

# rest of brew shellenv (its fpath half is in the final hook)
HOMEBREW_PREFIX = "/opt/homebrew"
HOMEBREW_CELLAR = "/opt/homebrew/Cellar"
HOMEBREW_REPOSITORY = "/opt/homebrew"
INFOPATH = "/opt/homebrew/share/info"

ZSH = "{{env.HOME}}/.oh-my-zsh"
EDITOR = "vim"
VISUAL = "vim"

DIRENV_WARN_TIMEOUT = "1m"
# macOS only. [env] silently IGNORES an `os = [...]` key -- it is accepted and
# then not applied -- so the gate has to be a template. The else branch must
# pass the inherited value through: an empty template still exports VAR='',
# which on Linux would clobber a real ssh-agent rather than leave it alone.
SSH_AUTH_SOCK = "{% if os() == 'macos' %}{{ env.HOME }}/Library/Containers/com.bitwarden.desktop/Data/.bitwarden-ssh-agent.sock{% else %}{{ env.SSH_AUTH_SOCK | default(value='') }}{% endif %}"

GITHUB_TOKEN = { age = "" }

# ---------------------------------------------------------- shell aliases ----
# Applied by `mise activate` on directory entry (bash/zsh/fish only).

[shell_alias]
k = "kubectl"
now='date +"%T"'
nowdate='date +"%d-%m-%Y"'
nowsec='date +"%s"'
python="python3"
dot='cd ~/.dotfiles'
edit_env='vim ~/.env'
edit_m2='vim ~/.m2/settings.xml'
reload_shell='exec zsh -l'
j8='mise shell java@zulu-8'
j21='mise shell java@21'
j25='mise shell java@25'
grt='cd "$(git rev-parse --show-toplevel)"'
gs='git status'
gp='git push'
gpf='git push --force'
gpft='git push --follow-tags'
gpl='git pull --rebase'
gcl='git clone'
gst='git stash'

# ------------------------------------------------------- shell activation ----
# Without this, nothing ever writes ~/.zshrc, so a brand new shell has no mise,
# no tools and no [env]. it expands to two managed blocks:
# 
# ~/.zprofile (--shims, for login/non-interactive) 
# ~/.zshrc (activate, for interactive). 
#
# Both call bare `mise`, which is why bootstrap.sh
# must put ~/.local/bin on PATH via ~/.zshenv first.

[bootstrap.mise_shell_activate.zsh]
enabled = true

[bootstrap.hooks.final]
run = '''
ZSHRC="$HOME/.zshrc"
if grep -qF "# >>> mise bootstrap: shell init >>>" "$ZSHRC" 2>/dev/null; then
  echo "shell init: already wired"
else
  cat >> "$ZSHRC" <<'RC'

# >>> mise bootstrap: shell init >>>
# Order matters: fpath before oh-my-zsh (it runs compinit), precmd hooks after.
[ -d /opt/homebrew/share/zsh/site-functions ] && fpath=(/opt/homebrew/share/zsh/site-functions $fpath)
[ -d "$HOME/.docker/completions" ] && fpath=("$HOME/.docker/completions" $fpath)

export ZSH="${ZSH:-$HOME/.oh-my-zsh}"
ZSH_THEME="robbyrussell"   # change me
plugins=(git)              # change me
[ -r "$ZSH/oh-my-zsh.sh" ] && source "$ZSH/oh-my-zsh.sh"

command -v direnv >/dev/null && eval "$(direnv hook zsh)"

if [ "$TERM_PROGRAM" = "kiro" ] && command -v kiro >/dev/null; then . "$(kiro --locate-shell-integration-path zsh)"; fi
# <<< mise bootstrap: shell init <<<
RC
  echo "shell init: wired $ZSHRC"
fi
'''

# --------------------------------------------------------------- repos ----

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }

# ------------------------------------------------------------ brew taps ----
# mise resolves tapped formulae/casks itself; Homebrew need not be installed.
# Adopt apps already sitting in /Applications instead of failing on them.
# Relevant when bootstrapping over an existing machine rather than a fresh one.
[bootstrap.brew]
adopt = false

# ------------------------------------------------------- system packages ----

[bootstrap.packages]

# --- linux (apt self-gates; these never run on macOS) ---
# Deliberately minimal: enough to work in a container. The brew list above is
# the Mac's full set and is gated off here -- on linux-arm64 mise would resolve
# ~248 formulae against formulae.brew.sh and most have no bottle.
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:ca-certificates" = "latest"
"apt:gnupg" = "latest"
"apt:unzip" = "latest"
"apt:build-essential" = "latest"
"apt:zsh" = "latest"             # shell activation writes ~/.zshrc; need a zsh to read it
"apt:tree" = "latest"
"apt:wget" = "latest"

# ----------------------------------------------------------------- task ----

[tasks.bootstrap]
description = "安装 Homebrew 软件并执行基础检查"
run = """
if [[ "$(uname -s)" == "Darwin" ]]; then
  HOMEBREW_NO_AUTO_UPDATE=1 brew bundle install --file '{{ config_root }}/Brewfile' --no-upgrade
fi
echo "java:      $(java --version 2>&1 | head -1)"
echo "editor:    $EDITOR"
[ -d "$ZSH" ] && echo "oh-my-zsh: $ZSH" || echo "oh-my-zsh: MISSING"
[ -S "$SSH_AUTH_SOCK" ] && echo "ssh-agent: bitwarden socket ok" || echo "ssh-agent: socket missing (launch Bitwarden Desktop)"
"""
